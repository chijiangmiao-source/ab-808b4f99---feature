name: rad-lock-mgr

services:
  app:
    build:
      context: .
    image: rad-lock-mgr:latest
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      # 验收用：允许单个事件携带 crash=true 在撤销持久化阶段制造中断
      ALLOW_CRASH_INJECTION: "true"
      # rollforward（默认，崩溃重启后前滚到完整裁决后）；rollback 则回到事件前
      RECOVERY_MODE: "${RECOVERY_MODE:-rollforward}"
    ports:
      # 宿主机端口可配置：HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - lockdata:/data
    restart: "on-failure:5"

  verify:
    build:
      context: .
    image: rad-lock-mgr:latest
    command: ["python", "scripts/verify.py"]
    environment:
      APP_URL: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  lockdata:
